/* Layout: cabeçalho fixo com abas; cada exercício é uma ficha com a figura animada à esquerda e a descrição à direita; cronômetro de descanso fixo no rodapé. */
:root{
  --bg:#e6f3fb; --surface:#fbfdff; --stage:#f1f8fd; --ink:#2b3a55; --ink-2:#44546f; --muted:#5b6b86; --line:#c4dcec;
  --accent:#f58db3; --accent-fg:#b83a6e; --accent-btn:#c9386f; --on-accent:#ffffff; --accent-soft:#fde3ee;
  --blue:#9fd3f2; --blue-soft:#d3ebf9;
  --ok:#2a8566; --ok-soft:#d6f0e6; --warn:#8f5f14; --warn-soft:#fbeed2;
  --prop:#bcd6e8; --floor:#cfe4f3; --bar-bg:#bfe2f6; --bar-fg:#1f2f4a; --bar-mut:#3b5575;
  --font-d:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a26; --surface:#1a2332; --stage:#202b3c; --ink:#e8f1fa; --ink-2:#c3d2e3; --muted:#92a5bd; --line:#2f3d52;
  --accent:#ff9fc0; --accent-fg:#ffa9c7; --accent-btn:#ff9fc0; --on-accent:#2a1520; --accent-soft:#3b2230;
  --blue:#7fc3ea; --blue-soft:#1f3347;
  --ok:#5fd0a5; --ok-soft:#173529; --warn:#e0b25a; --warn-soft:#352b14;
  --prop:#3d5068; --floor:#26364b; --bar-bg:#2a4561; --bar-fg:#eaf5fd; --bar-mut:#a8c3dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a26; --surface:#1a2332; --stage:#202b3c; --ink:#e8f1fa; --ink-2:#c3d2e3; --muted:#92a5bd; --line:#2f3d52;
  --accent:#ff9fc0; --accent-fg:#ffa9c7; --accent-btn:#ff9fc0; --on-accent:#2a1520; --accent-soft:#3b2230;
  --blue:#7fc3ea; --blue-soft:#1f3347;
  --ok:#5fd0a5; --ok-soft:#173529; --warn:#e0b25a; --warn-soft:#352b14;
  --prop:#3d5068; --floor:#26364b; --bar-bg:#2a4561; --bar-fg:#eaf5fd; --bar-mut:#a8c3dc; color-scheme:dark}

[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-b);margin:0;padding-inline:0;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4,h5{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-fg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--blue-soft);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:auto;border-radius:6px;display:block}
.brand b{display:block;font:700 24px/1 var(--font-d);letter-spacing:.04em;text-transform:uppercase}
.brand span{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#installBtn{margin-left:auto}
#installBtn:not([hidden])+#tabs{margin-left:0}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:100%}
#tabs::-webkit-scrollbar{display:none}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:600 17px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:640px){#tabs{margin-left:0;width:100%}}

main{padding-block:22px 40px}
.sec-title{font:700 34px/1.05 var(--font-d);text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font:600 13px/1.2 var(--font-b);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.lead{color:var(--ink-2);max-width:68ch;margin:6px 0 0}
.stack{display:grid;gap:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

.btn{border:1.5px solid var(--ink);background:none;border-radius:8px;padding:9px 14px;font-weight:600;min-height:44px;line-height:1.1}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.pri{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{min-height:38px;padding:6px 10px;font-size:14px}
.btn.ghost{border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink-2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent-fg)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* treino header */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weeknav .wk{font:700 40px/1 var(--font-d);text-transform:uppercase;letter-spacing:.02em}
.weeknav .wk small{font-size:22px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:none;display:grid;place-items:center;font-size:20px}
.iconbtn:hover{border-color:var(--ink)}
.blocknote{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:15px}
.blocknote.rec{background:var(--ok-soft)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:16px}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;position:relative;min-height:64px}
.day b{display:block;font:700 22px/1 var(--font-d);letter-spacing:.04em}
.day span{display:block;font-size:13px;color:var(--muted);line-height:1.25;margin-top:4px}
.day[aria-pressed="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.day.done::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--ok);font-weight:700}
.sess-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.progress{height:8px;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:99px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.clock{font:700 28px/1 var(--font-d);letter-spacing:.04em}

details.warm{margin-top:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.warm>summary{padding:12px 14px;font:600 18px/1.2 var(--font-d);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.warm ul{list-style:none;margin:0;padding:0 14px 12px;display:grid;gap:8px}
.warm li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.warm input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.warm li small{display:block;color:var(--muted)}

/* exercício */
.ex{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;scroll-margin-top:90px}
@media (max-width:860px){.ex{grid-template-columns:minmax(0,1fr);padding:14px}}
.ex-fig{align-self:start;position:sticky;top:calc(76px + env(safe-area-inset-top,0px));display:grid;gap:10px}
@media (max-width:860px){.ex-fig{position:static}}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage .ph{position:absolute;left:10px;top:8px;font:700 22px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-fg)}
.stage .tp{position:absolute;right:10px;top:10px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stage .pp{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:13px}
.grip{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.grip svg{width:100%;height:auto;display:block}
.grip p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.4}
.grip p b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.ex-body{min-width:0;display:grid;gap:14px;align-content:start}
.ex-body h3{font:700 32px/1.02 var(--font-d);text-transform:uppercase;letter-spacing:.015em}
.ex-body .sub{margin:4px 0 0;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.lvl i.on{background:var(--accent)}
.resume{margin:0;font-size:17px;color:var(--ink)}
.how h4{font:600 16px/1.2 var(--font-d);text-transform:uppercase;letter-spacing:.1em;color:var(--accent-fg);margin:14px 0 6px}
.how h4:first-child{margin-top:0}
.how ol,.how ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.how li::marker{color:var(--accent-fg);font-weight:700}
.how p{margin:0}
.breath{margin-top:10px!important;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--ink) 6%,transparent);font-size:15px}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;font:600 16px/1.3 var(--font-d);text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
details.more[open]>summary{margin-bottom:6px}
details.more ul,details.more p{margin:0;padding-left:1.2em;display:grid;gap:6px}
details.more p{padding-left:0}
.shoulder{border-left:3px solid var(--warn);padding-left:12px}

.rx{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.rx div{min-width:0}
.rx b{display:block;font:700 26px/1 var(--font-d);letter-spacing:.02em}
.rx span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tec{margin:0;padding:10px 12px;border-radius:8px;background:var(--warn-soft);font-size:15px}
.hint{margin:0;padding:10px 12px;border-radius:8px;background:var(--ok-soft);font-size:15px}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:44px auto minmax(0,1fr);align-items:center;gap:6px 12px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.set.done{background:var(--ok-soft);border-color:transparent}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:none;display:grid;place-items:center;padding:0}
.chk svg{width:22px;height:22px;opacity:0}
.set.done .chk{background:var(--ok);border-color:var(--ok)}
.set.done .chk svg{opacity:1;stroke:#fff}
.sn{font:700 20px/1 var(--font-d);letter-spacing:.04em;text-transform:uppercase}
.fields{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}
.f{display:inline-flex;align-items:center;gap:6px}
.f input{width:76px;min-height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 8px;text-align:center;font-weight:600;font-size:17px}
.f input:focus{border-color:var(--ink)}
.f span{font-size:13px;color:var(--muted)}
.prev{grid-column:2 / -1;font-size:13px;color:var(--muted);margin-top:-2px}
.exhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cnt{font:700 20px/1 var(--font-d);letter-spacing:.06em;color:var(--muted)}

.finish{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.finish p{margin:0;color:var(--ink-2)}

/* programa */
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center}
.hero img{width:150px;height:auto;border-radius:12px;display:block}
@media (max-width:560px){.hero{grid-template-columns:minmax(0,1fr)}.hero img{width:110px}}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.phase{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:8px;align-content:start}
.phase h3{font:700 26px/1.05 var(--font-d);text-transform:uppercase}
.phase p{margin:0;font-size:15px;color:var(--ink-2)}
.phase .tag{height:6px;border-radius:99px}
.weeks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.weeks{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wcell{border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:left;background:var(--surface);display:grid;gap:6px;min-height:78px;position:relative}
.wcell b{font:700 24px/1 var(--font-d);letter-spacing:.03em}
.wcell small{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.wcell.cur{border-color:var(--ink)}
.wcell .dots{display:flex;gap:4px}
.wcell .dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.wcell .dots i.on{background:var(--ok);border-color:var(--ok)}
.p1{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.p2{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.p3{background:color-mix(in srgb,var(--accent) 24%,var(--surface))}
.p4{background:color-mix(in srgb,var(--accent) 36%,var(--surface))}
.tag.p1,.tag.p2,.tag.p3,.tag.p4{background:color-mix(in srgb,var(--accent) calc(var(--k)*1%),var(--line))}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:600 13px/1.2 var(--font-b);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.d{color:var(--ok);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.kpi b{display:block;font:700 40px/1 var(--font-d);letter-spacing:.02em}
.kpi span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:600 11px var(--font-b)}
.chart .bar{fill:var(--accent)}
.chart .bar.rec{fill:var(--ok)}
.chart .grid{stroke:var(--line);stroke-width:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.form input{min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 10px;width:100%}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.guide .panel h3{font:700 26px/1.05 var(--font-d);text-transform:uppercase;margin-bottom:8px}
.guide .panel p,.guide .panel li{font-size:16px}
.guide .panel ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.jump button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px}
.jump button:hover{border-color:var(--ink)}

/* modos */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:grid;gap:4px;min-height:92px}
.mode b{font:700 24px/1 var(--font-d);letter-spacing:.03em;text-transform:uppercase}
.mode span{font-size:14px;color:var(--ink-2);line-height:1.3}
.mode small{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-fg)}
.mode[aria-pressed="true"]{border-color:var(--accent-btn);background:var(--accent-soft)}
.panel.pink{background:var(--accent-soft);border-color:transparent}
.modebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.modebar button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;min-height:38px}
.modebar button[aria-pressed="true"]{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--on-accent)}
/* cronômetro */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar-bg);color:var(--bar-fg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:1120px;margin-inline:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.timer button{border:1.5px solid color-mix(in srgb,var(--bar-fg) 40%,transparent);background:none;color:var(--bar-fg);border-radius:8px;padding:5px 11px;min-height:40px;font-weight:600}
@media (max-width:640px){.timer{padding-top:8px}.timer .in{gap:8px}.timer button{min-height:36px;padding:4px 9px;font-size:14px}.timer .hide-s{display:none}.timer .grp{gap:6px}.readout small{max-width:30vw}.readout b{font-size:28px}.readout svg{width:40px;height:40px}}
.timer button:hover{border-color:var(--bar-fg)}
.timer .go{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--on-accent)}
.readout{display:flex;align-items:center;gap:12px;min-width:0}
.readout svg{width:48px;height:48px;flex:none}
.readout .ring-bg{stroke:color-mix(in srgb,var(--bar-fg) 22%,transparent)}
.readout .ring-fg{stroke:var(--accent-btn);transition:stroke-dashoffset .25s linear}
.readout b{display:block;font:700 34px/1 var(--font-d);letter-spacing:.04em}
.readout small{display:block;color:var(--bar-mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.timer .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.timer .lbl{font:600 13px/1 var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--bar-mut)}
.timer.run .idle-only,.timer:not(.run) .run-only{display:none}
.timer.fin{background:var(--ok)}
.timer .go{box-shadow:none}
.timer.fin,.timer.fin button{color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

function phaseAt(tp,t){
  const [d,pb,up,pt]=tp, T=d+pb+up+pt; let x=t%T, k=Math.floor(t/T);

  x-=d; if(pb>0 && x<pb) return {u:1,ph:1,rem:pb-x,rep:k};
  x-=pb; if(x<up) return {u:1-ease(x/up),ph:2,rem:up-x,rep:k};

function mountAnim(box,ex,tp){
  const svg=box.querySelector('svg.fig'), label=box.querySelector('.ph'), btn=box.querySelector('.pp');
  const draw = buildBody(svg,Object.assign({hl:ex.hl},ex.cfg));
  const inst={svg,tp,draw,t0:performance.now(),paused:reduce,tp0:0,vis:true,label};
  inst.render=function(t){ const p=phaseAt(inst.tp,t); inst.draw(p.u,p.rep); if(label) label.textContent=PHN[p.ph]+(p.rem>0.05?' · '+Math.ceil(p.rem-0.001)+'s':''); };

const topOf = r=>{ const m=String(r).match(/(\d+)\D*$/); return m&&!/máx/.test(r)?+m[1]:null; };
const midOf = r=>{ const n=String(r).match(/\d+/g); if(!n) return 10; return n.length>1?(+n[0]+ +n[1])/2:+n[0]; };
const ordOf = k=>{ const [w,d]=k.split('-'); return (+w)*10+(+d.slice(1)); };
const MODE=()=>MODES[S.mode]||MODES.daily;
function daysOf(){ return MODE().days; }
function getSession(w,d){
  const base=SESS[d], ph=phaseOf(w), dl=DELOAD_WEEKS.includes(w);
  const rows=base.rows.map(r=>{ const id=Array.isArray(r.id)?r.id[ph-1]:r.id; let sets=r.sets[ph-1];
    if(dl) sets=Math.max(1,Math.ceil(sets*0.6));
    return {id,sets,reps:r.reps[ph-1],tp:r.tp,rest:r.rest,rir:dl?'muito leve':RIRTXT[ph-1]}; });
  return {title:base.n,rows,deload:dl};
}
function estMin(rows){ let s=180; rows.forEach(r=>{ const tp=TEMPOS[r.tp], ex=EX[r.id], n=midOf(r.reps); let work=ex.unit==='seg'?n:n*(tp[0]+tp[1]+tp[2]+tp[3]); if(/lado/.test(r.reps)) work*=2; work=Math.max(15,work); s+=r.sets*work+Math.max(0,r.sets-1)*r.rest+10; }); return Math.round(s/60); }
const sessOf = k=>S.sess[k];
function lastSets(exId,key){
  const cur=ordOf(key); let best=null,bo=-1;
  for(const k in S.sess){ const o=ordOf(k); if(o>=cur||o<=bo) continue;
    const sets=Object.entries(S.sess[k].sets||{}).filter(([_,v])=>v.e===exId&&v.d); if(sets.length){ best=sets; bo=o; } }
  if(!best) return null; return best.map(([kk,v])=>({j:+kk.split('-')[1],r:v.r,kg:v.kg})).sort((a,b)=>a.j-b.j);
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2600); }

const LN=()=>(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||null;
let notifAsked=false;
async function nSync(){
  const ln=LN(); if(!ln) return;
  try{
    await ln.cancel({notifications:[{id:1}]});
    if(T.run&&!T.paused&&S.beep){
      if(!notifAsked){ notifAsked=true; await ln.requestPermissions(); }
      await ln.schedule({notifications:[{id:1,title:'Descanso acabou',body:T.label||'Hora da próxima série',schedule:{at:new Date(T.end),allowWhileIdle:true}}]});
    }
  }catch(e){}
}

const T = {run:false,paused:false,end:0,total:0,left:0,label:'',lastBeep:-1};
let actx=null;
function beep(f,d){ if(!S.beep) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.type='sine'; g.gain.value=.18; o.connect(g);g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d); o.stop(actx.currentTime+d+.02);}catch(e){} }
function buzz(p){ if(S.beep&&navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
function tStart(sec,label){ if(sec<=0) return; T.total=sec;T.end=Date.now()+sec*1000;T.run=true;T.paused=false;T.label=label||'Descanso';T.lastBeep=-1; $('#timer').classList.remove('fin'); tUI(); nSync(); }
function tStop(){ T.run=false; $('#timer').classList.remove('run','fin'); document.title=TITLE; nSync(); }
function tLeft(){ return T.paused?T.left:Math.max(0,Math.ceil((T.end-Date.now())/1000)); }
function tUI(){
  const el=$('#timer'); el.classList.toggle('run',T.run); const l=tLeft();
  $('#tTime').textContent=fmt(l); $('#tLabel').textContent=T.label; $('#tPlay').textContent=T.paused?'Retomar':'Pausar';
  $('#ring').style.strokeDashoffset=String(125.66*(1-(T.total?l/T.total:0)));
  document.title=T.run?fmt(l)+' · '+TITLE:TITLE;
}
setInterval(()=>{ if(!T.run||T.paused) return; const l=tLeft(); tUI();
  if(l<=3&&l>0&&T.lastBeep!==l){ T.lastBeep=l; beep(660,.12); }
  if(l<=0){ T.run=false; $('#timer').classList.add('fin','run'); $('#tTime').textContent='Vai!'; $('#tLabel').textContent='Descanso acabou'; $('#ring').style.strokeDashoffset='0'; beep(990,.6); buzz([250,100,250]); document.title=TITLE; setTimeout(()=>{ if(!T.run) $('#timer').classList.remove('run','fin'); },4000); } },250);
$('#timer').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]'); if(!b) return; const a=b.dataset.t;
  if(a==='pp'){ if(T.paused){T.paused=false;T.end=Date.now()+T.left*1000;} else {T.left=tLeft();T.paused=true;} tUI(); nSync(); }
  else if(a==='skip'){ tStop(); }
  else if(a==='+15'||a==='-15'){ const d=a==='+15'?15:-15; if(T.paused){T.left=Math.max(1,T.left+d);} else {T.end+=d*1000;} T.total=Math.max(T.total,tLeft()); tUI(); nSync(); }
  else if(a[0]==='s'){ tStart(+a.slice(1),'Descanso'); }
});

$('#optAuto').onclick=()=>{ S.auto=!S.auto; save(); syncOpts(); toast(S.auto?'Descanso automático ligado':'Descanso automático desligado'); };

function exCard(id,row,idx,mode,key){

    '<div class="ex-body"><div><h3>'+esc(ex.nome)+'</h3><p class="sub">'+esc(ex.sub)+'</p><div class="chips">'+ex.alvo.map(a=>'<span class="chip acc">'+esc(a)+'</span>').join('')+lvl(ex.nivel)+'</div></div>'+
    rx+
    '<p class="resume">'+ex.resumo+'</p>'+
    '<div class="how"><h4>Posição inicial</h4><ol>'+li(ex.setup)+'</ol><h4>Execução</h4><ol>'+li(ex.exec)+'</ol><p class="breath"><b>Respiração.</b> '+ex.resp+'</p></div>'+
    '<details class="more"'+open+'><summary>Erros comuns</summary><ul>'+li(ex.erros)+'</ul></details>'+

}

/* ---- progresso ---- */
function allStats(){
  let fin=0,sets=0,reps=0; const byWeek={}; const pr={}; const wk={};
  for(const k in S.sess){ const s=S.sess[k], w=+k.split('-')[0]; if(s.fin){ fin++; wk[w]=(wk[w]||0)+1; }
    for(const kk in s.sets){ const x=s.sets[kk]; if(!x.d) continue; sets++; if(x.r!=null){ reps+=x.r; byWeek[w]=(byWeek[w]||0)+1; if(!pr[x.e]||x.r>pr[x.e].r) pr[x.e]={r:x.r,w}; } } }
  return {fin,sets,reps,byWeek:wk,pr};
}
function barChart(byWeek){
  const W=720,Ht=190,pl=30,pb=24,pt=10, top=Math.max(5,...Object.values(byWeek));
  let g='',i;
  for(i=0;i<=top;i++){ const y=pt+(Ht-pt-pb)*(1-i/top); g+='<line class="grid" x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+i+'</text>'; }
  const bw=(W-pl)/WEEKS;
  for(let w=1;w<=WEEKS;w++){ const val=byWeek[w]||0, h=(Ht-pt-pb)*val/top, x=pl+(w-1)*bw+6;
    g+=(val?'<rect class="bar'+(DELOAD_WEEKS.includes(w)?' rec':'')+'" x="'+x+'" y="'+(Ht-pb-h)+'" width="'+(bw-12)+'" height="'+h+'" rx="3"><title>Semana '+w+': '+val+' treino(s)</title></rect>':'')+'<text x="'+(x+(bw-12)/2)+'" y="'+(Ht-8)+'" text-anchor="middle">'+w+'</text>'; }
  if(!Object.keys(byWeek).length) g+='<text x="'+(W/2)+'" y="'+(Ht/2)+'" text-anchor="middle" style="font-size:14px">Conclua um treino para ver as barras aparecerem aqui.</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+Ht+'" role="img" aria-label="Treinos concluídos por semana">'+g+'</svg>';
}
function streak(){ // semanas seguidas (até a atual) com pelo menos 1 treino
  const a=allStats().byWeek; let n=0; for(let w=curWeek();w>=1;w--){ if(a[w]) n++; else if(w===curWeek()) continue; else break; } return n; }
function rProgresso(v){
  const a=allStats(), cw=curWeek();
  const prs=Object.entries(a.pr).sort((x,y)=>y[1].r-x[1].r);
  const meas=S.meas.slice().sort((x,y)=>x.date<y.date?-1:1), f=meas[0], l=meas[meas.length-1];
  const dl=(k,u)=>f&&l&&meas.length>1&&f[k]!=null&&l[k]!=null?(((l[k]-f[k])>0?'+':'')+(Math.round((l[k]-f[k])*10)/10)+u):'–';
  v.innerHTML='<div class="stack"><div><div class="eyebrow">Seu progresso</div><h2 class="sec-title">Evolução</h2></div>'+
  '<div class="kpis"><div class="kpi"><b class="num">'+a.fin+'</b><span>Treinos concluídos</span></div><div class="kpi"><b class="num">'+a.sets+'</b><span>Séries feitas</span></div><div class="kpi"><b class="num">'+streak()+'</b><span>Semanas seguidas</span></div><div class="kpi"><b class="num">'+cw+'<small style="font-size:22px;color:var(--muted)">/'+WEEKS+'</small></b><span>Semana atual</span></div></div>'+
  '<section class="panel"><h3 class="sec-title" style="font-size:24px">Treinos por semana</h3><p class="lead" style="margin-bottom:8px">Cada barra é uma semana. As barras verdes são as semanas leves. O que importa é a regularidade, não a perfeição.</p>'+barChart(a.byWeek)+'</section>'+
  '<section class="panel"><h3 class="sec-title" style="font-size:24px">Medidas</h3><p class="lead" style="margin-bottom:12px">Meça a cada 3 ou 4 semanas, de manhã, sempre do mesmo jeito. A balança sozinha engana: a fita métrica e as fotos de frente, lado e costas mostram mais.</p>'+
   '<form class="form" id="measForm"><label>Data<input type="date" id="mDate" value="'+todayISO()+'"></label><label>Peso (kg)<input type="number" id="mPeso" step="0.1" inputmode="decimal"></label><label>Cintura (cm)<input type="number" id="mCint" step="0.5" inputmode="decimal"></label><label>Quadril (cm)<input type="number" id="mQuad" step="0.5" inputmode="decimal"></label><label>Coxa (cm)<input type="number" id="mCoxa" step="0.5" inputmode="decimal"></label><button type="submit" class="btn pri">Salvar medidas</button></form>'+
   (meas.length?'<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Data</th><th>Peso</th><th>Cintura</th><th>Quadril</th><th>Coxa</th><th></th></tr></thead><tbody>'+meas.map(m=>'<tr><td class="num">'+m.date.split('-').reverse().join('/')+'</td><td class="num">'+(m.peso??'–')+'</td><td class="num">'+(m.cint??'–')+'</td><td class="num">'+(m.quad??'–')+'</td><td class="num">'+(m.coxa??'–')+'</td><td><button type="button" class="btn sm ghost" data-act="mdel" data-id="'+m.id+'">Excluir</button></td></tr>').join('')+'<tr><td><b>Variação</b></td><td class="d num">'+dl('peso',' kg')+'</td><td class="d num">'+dl('cint',' cm')+'</td><td class="d num">'+dl('quad',' cm')+'</td><td class="d num">'+dl('coxa',' cm')+'</td><td></td></tr></tbody></table></div>':'<p class="lead" style="margin-top:12px">Nenhuma medida ainda. Registre a de partida antes do primeiro treino.</p>')+'</section>'+
  '<section class="panel"><h3 class="sec-title" style="font-size:24px">Melhores marcas</h3>'+(prs.length?'<div class="table-wrap"><table><thead><tr><th>Exercício</th><th>Melhor série</th><th>Semana</th></tr></thead><tbody>'+prs.map(([id,p])=>'<tr><td>'+esc(EX[id].nome)+'</td><td class="num">'+p.r+' '+(EX[id].unit||'reps')+'</td><td class="num">'+p.w+'</td></tr>').join('')+'</tbody></table></div>':'<p class="lead">Suas melhores marcas aparecem aqui conforme você anota o que fez em cada série.</p>')+'</section>'+
  '<details class="panel"><summary style="cursor:pointer;font-weight:600">Backup dos dados</summary><p class="lead" style="margin:10px 0">Seus dados ficam salvos neste aparelho. Copie o texto abaixo para guardar uma cópia, ou cole uma cópia antiga para restaurar.</p><textarea id="bk" aria-label="Backup" spellcheck="false">'+esc(JSON.stringify(S))+'</textarea><div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-act="bkcopy">Copiar backup</button><button type="button" class="btn sm" data-act="bkrestore">Restaurar do texto</button><button type="button" class="btn sm ghost" data-act="reset" id="rstBtn">Apagar tudo</button></div></details></div>';
}

/* ---- guia ---- */
function rGuia(v){
  v.innerHTML='<div class="stack"><div><div class="eyebrow">Antes de começar</div><h2 class="sec-title">Guia rápido</h2></div><div class="guide">'+
  '<section class="panel"><h3>Como usar</h3><ul><li>Em <b>Programa</b>, escolha o modo: todo dia útil, dia sim dia não ou só fim de semana. Dá para trocar quando quiser.</li><li>Em <b>Treino</b>, faça o aquecimento, depois os exercícios na ordem. Marque cada série ao terminar.</li><li>Ao marcar uma série, o <b>cronômetro de descanso</b> começa sozinho. Use −15 s, +15 s ou Pular. O botão Auto liga e desliga isso.</li><li>No final, toque em <b>Concluir treino</b> e faça o alongamento.</li></ul></section>'+
  '<section class="panel"><h3>Primeiros dias</h3><ul><li>Use roupa confortável e tênis, ou fique descalça num piso que não escorregue.</li><li>Tenha uma cadeira firme e uma parede por perto, para apoio.</li><li>Um treino curto e bem feito vale mais que um longo e forçado.</li><li>Dor muscular leve no dia seguinte é normal. Dor aguda ou que piora, não: pare o exercício.</li></ul></section>'+
  '<section class="panel"><h3>Alimentação e água</h3><ul><li>O treino ajuda, mas a perda de barriga vem principalmente da alimentação. Não precisa de dieta radical.</li><li>Beba água ao longo do dia e coma proteína em todas as refeições (ovos, frango, peixe, feijão, iogurte).</li><li>Prefira comida de verdade: legumes, frutas, arroz e feijão. Reduza refrigerante, doces e frituras aos poucos.</li><li>Quando possível, converse com um nutricionista para um plano feito para você.</li></ul></section>'+
  '<section class="panel"><h3>Sono e rotina</h3><ul><li>Durma de 7 a 9 horas. O corpo se recupera e controla a fome durante o sono.</li><li>Caminhar 20 a 30 minutos nos dias de descanso ajuda muito e é bem leve.</li><li>Escolha um horário fixo para treinar. Fica muito mais fácil criar o hábito.</li></ul></section>'+
  '<section class="panel"><h3>O que esperar</h3><ul><li>Nas primeiras semanas, mais disposição e força. A mudança no corpo vem depois, com a regularidade.</li><li>Ninguém escolhe onde perde gordura. A barriga diminui junto com o corpo todo, com treino, alimentação e sono.</li><li>Com treino e alimentação consistentes, as primeiras mudanças em medidas costumam aparecer entre 4 e 8 semanas.</li><li>Se tiver qualquer problema de saúde, dor persistente ou estiver grávida, consulte um profissional antes de começar.</li></ul></section>'+
  '<section class="panel"><h3>Glossário</h3><ul><li><b>Série:</b> um bloco de repetições seguidas.</li><li><b>Repetição:</b> uma vez o movimento completo.</li><li><b>Tempo 2-0-1-0:</b> 2 s descendo, 0 s embaixo, 1 s subindo, 0 s no topo.</li><li><b>Por lado:</b> faça as repetições de uma perna, depois da outra.</li><li><b>Esforço leve:</b> dá para conversar e ainda sobram repetições.</li></ul></section></div></div>';
}

/* ============ EVENTOS ============ */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){ go(tb.dataset.tab); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='wk'){ S.sel.w=Math.max(1,Math.min(WEEKS,S.sel.w+ +b.dataset.d)); pickDay(); save(); render(); }
  else if(a==='curwk'){ S.sel.w=curWeek(); pickDay(); save(); render(); }
  else if(a==='mode'){ setMode(b.dataset.m); toast('Modo: '+MODES[S.mode].n); render(); }
  else if(a==='day'){ S.sel.d=b.dataset.d; save(); render(); }
  else if(a==='goweek'){ S.sel.w=+b.dataset.w; pickDay(); save(); go('treino'); }
  else if(a==='jump'){ const t=document.getElementById('ex-l'+b.dataset.id); if(t) t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}); }
  else if(a==='chk'){ toggleSet(b.closest('.set')); }
  else if(a==='finish'){ finishSession(); }
  else if(a==='reopen'){ const s=sessOf(curKey()); if(s){ s.fin=0; save(); render(); } }
  else if(a==='mdel'){ S.meas=S.meas.filter(m=>m.id!==b.dataset.id); save(); render(); }
  else if(a==='bkcopy'){ const t=$('#bk'); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>toast('Backup copiado'),()=>toast('Copie o texto selecionado')); }catch(err){ toast('Copie o texto selecionado'); } }
  else if(a==='bkrestore'){ try{ const j=JSON.parse($('#bk').value); if(j&&j.v===1){ S=j; save(); syncOpts(); toast('Dados restaurados'); render(); } else toast('Texto de backup inválido'); }catch(err){ toast('Texto de backup inválido'); } }
  else if(a==='reset'){ if(b.dataset.sure){ S=fresh(); save(); toast('Dados apagados'); render(); } else { b.dataset.sure=1; b.textContent='Toque de novo para confirmar'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.sure; b.textContent='Apagar tudo'; } },3500); } }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-act="warm"]')){ const s=ensureSess(curKey()); s.warm[t.dataset.i]=t.checked; save(); }
  else if(t.matches('[data-act="cool"]')){ const s=ensureSess(curKey()); s.cool[t.dataset.i]=t.checked; save(); }
  else if(t.id==='startDate'&&t.value){ S.start=t.value; save(); render(); }
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.matches('.set .reps,.set .kg')) return;
  const row=t.closest('.set'), rec=ensureSess(curKey()).sets, k=row.dataset.k, x=rec[k]||(rec[k]={e:row.dataset.e,d:0});
  const val=t.value===''?null:Number(t.value);
  if(t.classList.contains('reps')) x.r=val; else x.kg=val;
  save();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='measForm') return; e.preventDefault();
  const n=id=>{ const v=$('#'+id).value; return v===''?null:Number(v); };
  const m={id:String(Date.now()),date:$('#mDate').value||todayISO(),peso:n('mPeso'),cint:n('mCint'),quad:n('mQuad'),coxa:n('mCoxa')};
  if([m.peso,m.cint,m.quad,m.coxa].every(x=>x==null)){ toast('Preencha pelo menos uma medida'); return; }
  S.meas.push(m); save(); toast('Medidas salvas'); render();
});
function ensureSess(k){ const s=S.sess[k]||(S.sess[k]={sets:{},warm:{},cool:{}}); if(!s.sets) s.sets={}; if(!s.warm) s.warm={}; if(!s.cool) s.cool={}; return s; }
function updateProgressUI(){
  const sess=getSession(S.sel.w,S.sel.d), st=sessStats(curKey(),sess);
  const p=$('#sProg'); if(p) p.style.width=(st.tot?st.done/st.tot*100:0)+'%';
  const c=$('#sCount'); if(c) c.textContent=st.done+' de '+st.tot+' séries feitas';
  sess.rows.forEach((r,i)=>{ const n=$('[data-cnt="'+i+'"]'); if(n){ const ss=(sessOf(curKey())||{sets:{}}).sets; let d=0; for(let j=0;j<r.sets;j++) if((ss[i+'-'+j]||{}).d) d++; n.textContent=d+'/'+r.sets; } });
}
function toggleSet(row){
  const key=curKey(), s=ensureSess(key), k=row.dataset.k, x=s.sets[k]||(s.sets[k]={e:row.dataset.e,d:0});
  x.d=x.d?0:1; row.classList.toggle('done',!!x.d); row.querySelector('.chk').setAttribute('aria-pressed',!!x.d);
  if(x.d){
    if(!s.st){ s.st=Date.now(); clock.start(); }
    try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    const [i,j]=k.split('-').map(Number), sess=getSession(S.sel.w,S.sel.d), r=sess.rows[i], last=(i===sess.rows.length-1&&j===r.sets-1);
    if(S.auto&&r.rest&&!last) tStart(r.rest,EX[r.id].nome+' · série '+(j+1));
    save(); updateProgressUI();
    const st=sessStats(key,sess); if(st.done===st.tot) toast('Todas as séries feitas. Toque em Concluir treino.');
  } else { save(); updateProgressUI(); }
}
function finishSession(){
  const key=curKey(), s=ensureSess(key); s.fin=Date.now(); s.dur=s.st?Math.round((s.fin-s.st)/1000):null; save(); toast('Treino concluído. Bom trabalho!'); tStop(); render(); window.scrollTo({top:0});
}

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; const b=$('#installBtn'); if(b) b.hidden=false; });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; const b=$('#installBtn'); if(b) b.hidden=true; toast('App instalado'); });

const ART=document.querySelector('.brand img').getAttribute('src');
(function init(){
  const h=(location.hash||'').slice(1); if(TABS.some(t=>t[0]===h)) tab=h;
  if(!S.upd){ S.sel.w=curWeek(); }
